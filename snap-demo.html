<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>吸附加画线 v5 Demo</title><style>
body{margin:0;padding:20px 16px;background:#f6f5f1;font-family:system-ui;max-width:420px}
h1{font-size:28px;margin:0 0 10px}
/* ===== Snap-line kit v5 ===== */
.sl{position:relative;height:440px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sl::-webkit-scrollbar{display:none}
.sl .track{position:relative;padding:170px 0 170px 34px}
.sl .rail{position:absolute;left:11px;top:0;bottom:0;width:2px;background:#e6e3dc}
.sl .seg{position:absolute;left:11px;width:2px;background:#111;transform-origin:50% 0;transform:scaleY(0)}
.sl .dot{position:absolute;left:6px;width:12px;height:12px;border-radius:50%;background:#d9d6ce;transition:transform .3s cubic-bezier(.16,1,.3,1),background-color .3s}
.sl .dot.on{background:#c6e21f;transform:scale(1.35)}
.sl .card{position:relative;height:96px;margin:0 0 12px;border-radius:18px;padding:14px 16px;box-sizing:border-box;scroll-snap-align:center;
 background:#fff;overflow:hidden;will-change:transform;transform-origin:0 50%}
.sl .card .tint{position:absolute;inset:0;opacity:0;will-change:opacity}
.sl .card b,.sl .card p,.sl .card small{position:relative}
.sl .card b{font-size:22px;display:flex;justify-content:space-between}.sl .card small{font-size:12px;opacity:.6}
.sl .card p{margin:6px 0 0;font-size:13px}
@media (prefers-reduced-motion:reduce){.sl .seg,.sl .dot{transition:none!important}}
</style></head><body>
<h1>今日大词</h1>
<div class="sl" id="sl"><div class="track"><i class="rail"></i></div></div>
<p style="color:#888;font-size:12px">示例内容。上下滑动，松手后最近的卡吸附到中间，左边画线连到它。</p>
<script>
/* ===== Snap-line kit v5 (copy into index-v5) ===== */
function snapLine(box,items,{onPick}={}){
  const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const track=box.querySelector('.track');const colors=['#c7c2ff','#d6ec3a','#ff6a2b','#b9c4ff','#ffd166','#7ee0c3'];
  const cards=items.map((it,i)=>{const c=document.createElement('div');c.className='card';
    c.innerHTML=`<i class="tint" style="background:${colors[i%colors.length]}"></i><b>${it.w}<small>${it.zh}</small></b><p>${it.ex}</p>`;track.appendChild(c);return c});
  const dots=cards.map(c=>{const d=document.createElement('i');d.className='dot';track.appendChild(d);return d});
  const cy=c=>c.offsetTop+c.offsetHeight/2;
  dots.forEach((d,i)=>d.style.top=(cy(cards[i])-6)+'px');
  let cur=-1,raf=0,timer=0;const segs=[];
  const frame=()=>{raf=0;const mid=box.scrollTop+box.clientHeight/2;
    cards.forEach(c=>{const t=Math.min(1,Math.abs(cy(c)-mid)/110);       // 0 = 正中，1 = 一张卡以外
      c.style.transform=`scale(${1-.04*t})`;c.firstChild.style.opacity=(1-t)*(1-t)})};
  box.addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(frame);clearTimeout(timer);timer=setTimeout(settle,110)},{passive:true});
  function settle(){const mid=box.scrollTop+box.clientHeight/2;let best=0,d=1e9;
    cards.forEach((c,i)=>{const dd=Math.abs(cy(c)-mid);if(dd<d){d=dd;best=i}});
    if(best===cur)return;const prev=cur;cur=best;
    dots.forEach((x,i)=>x.classList.toggle('on',i===best));onPick&&onPick(best);
    if(prev<0)return;
    const a=Math.min(prev,best),b=Math.max(prev,best);
    const s=document.createElement('i');s.className='seg';s.style.top=cy(cards[a])+'px';s.style.height=(cy(cards[b])-cy(cards[a]))+'px';
    if(best<prev)s.style.transformOrigin='50% 100%';           // 往上滑就从下往上画
    track.insertBefore(s,dots[0]);segs.push(s);
    while(segs.length>1)segs.shift().animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'}).onfinish=function(){this.effect.target.remove()};
    if(RM){s.style.transform='scaleY(1)';return}
    s.animate([{transform:'scaleY(0)'},{transform:'scaleY(1)'}],{duration:480,delay:150,easing:'cubic-bezier(.65,0,.35,1)',fill:'both'});
  }
  frame();box.scrollTop=cy(cards[0])-box.clientHeight/2;setTimeout(settle,60);
}
snapLine(document.getElementById('sl'),[
 {w:'make',zh:'做 / 使',ex:'Make it simple.'},
 {w:'take',zh:'拿 / 花费',ex:'It takes ten minutes.'},
 {w:'get',zh:'得到 / 变得',ex:'I get it now.'},
 {w:'give',zh:'给',ex:'Give me a minute.'},
 {w:'keep',zh:'保持',ex:'Keep going.'},
 {w:'put',zh:'放',ex:'Put it on the desk.'}]);
</script></body></html>
